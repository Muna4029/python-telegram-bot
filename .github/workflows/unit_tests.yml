name: Unit Tests

on: push

permissions: {}

jobs:
  pytest:
    name: pytest
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.13'
          - '3.14.0-beta.3'
        os:
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -W ignore -m pip install --upgrade pip
          python -W ignore -m pip install . --group tests

      - name: Test with pytest
        run: |
          # Test without optional dependencies first.
          # This includes testing without pytz, jobqueue,
          # ratelimiter, webhooks, callback data, socks, and http2.

          TO_TEST="test_no_passport.py or test_datetime.py or test_defaults.py or test_jobqueue.py or test_applicationbuilder.py or test_ratelimiter.py or test_updater.py or test_callbackdatacache.py or test_request.py"

          pytest -v --cov -k "${TO_TEST}" \
            --junit-xml=.test_report_no_optionals_junit.xml

          opt_dep_status=$?

          # Run the full test suite with optional dependencies.
          export TEST_WITH_OPT_DEPS='true'

          pip install .[all]
          install_status=$?

          if [ "$install_status" -eq 0 ]; then
            pytest -v --cov --cov-append \
              -n auto --dist worksteal \
              --junit-xml=.test_report_optionals_junit.xml

            main_status=$?
          else
            main_status=$install_status
          fi

          # Preserve failures from either test suite.
          exit $(( opt_dep_status || main_status ))

        env:
          JOB_INDEX: ${{ strategy.job-index }}
          BOTS: ${{ secrets.BOTS }}
          TEST_WITH_OPT_DEPS: 'false'
          TEST_BUILD: 'true'

        shell: bash --noprofile --norc {0}

      # Check which JUnit XML reports were generated.
      - name: Check test reports
        id: check_reports
        if: always()
        shell: bash
        run: |
          reports=()

          for report in \
            .test_report_no_optionals_junit.xml \
            .test_report_optionals_junit.xml; do
            if [ -f "$report" ]; then
              reports+=("$report")
            else
              echo "Missing test report: $report"
            fi
          done

          if [ ${#reports[@]} -gt 0 ]; then
            echo "reports_exist=true" >> "$GITHUB_OUTPUT"

            {
              echo "report_paths<<EOF"
              printf '%s\n' "${reports[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "reports_exist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test Summary
        id: test_summary
        if: ${{ always() && steps.check_reports.outputs.reports_exist == 'true' }}
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86
        with:
          paths: ${{ steps.check_reports.outputs.report_paths }}
